<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mumble Web Client</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/favicon180px.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="favicons/favicon32px.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="favicons/favicon16px.png"
      sizes="16x16"
    />
    <link rel="manifest" href="favicons/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Mumble" />
    <meta name="application-name" content="Mumble" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://welcome.flexpair.com" />
    <link rel="preconnect" href="https://identity.netlify.com" />

    <!-- Preload LCP image to reduce render delay -->
    <link rel="preload" as="image" href="AdobeStock_74031703-HCZ3WC3P.png" />

    <!-- HtmlWebpackPlugin: static stylesheet reference (MiniCssExtractPlugin emits theme.css) -->
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="index.css" />

    <!-- Script order preserved manually (inject:false) -->
    <script src="config.js"></script>
    <script src="config.local.js"></script>
  <script src="theme.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>  <body>
    <!-- Vue.js root component (replaces all Knockout UI) -->
    <div id="app"></div>
  </body>
  <script src="index.js"></script>
</html>
