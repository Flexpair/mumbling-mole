<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mumble Web Client</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/favicon180px.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="favicons/favicon32px.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="favicons/favicon16px.png"
      sizes="16x16"
    />
    <link rel="manifest" href="favicons/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Mumble" />
    <meta name="application-name" content="Mumble" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://welcome.flexpair.com" />
    <link rel="preconnect" href="https://identity.netlify.com" />
    
    <!-- DNS Prefetch for domains that may be used later -->
    <link rel="dns-prefetch" href="https://welcome.flexpair.com" />
    <link rel="dns-prefetch" href="https://identity.netlify.com" />

    <!-- Module Preload: Start loading main bundle early -->
    <link rel="modulepreload" href="index.js" />

    <!-- Critical CSS: inline styles for initial paint (above-the-fold) -->
    <style>
      html, body {
        background-color: #eee;
        color: #000;
        font-family: Arial, sans-serif;
        margin: 0;
        overflow: hidden;
        height: 100%;
      }
      #app { height: 100%; }
      #container { height: 100%; position: relative; }
      .guacamole-placeholder {
        display: block;
        float: left;
        margin: 0;
        width: 100%;
        height: calc(100% - 36px);
        background-image: url("AdobeStock_74031703.webp");
        background-repeat: no-repeat;
        background-position: bottom;
        background-size: cover;
      }
      .toolbar-horizontal {
        display: flex;
        flex-flow: row nowrap;
        width: 100%;
      }
    </style>

    <!-- Non-critical CSS: loaded after initial paint -->
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="index.css" />

    <!-- Critical config scripts (must execute synchronously before app) -->
    <script src="config.js"></script>
    <script src="config.local.js"></script>

    <!-- Non-critical scripts: defer to avoid render-blocking -->
    <script defer src="theme.js"></script>
</head>  <body>
    <!-- Vue.js root component (replaces all Knockout UI) -->
    <div id="app"></div>
  </body>
  <!-- Netlify Identity must load BEFORE app to avoid race condition -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="index.js"></script>
</html>
