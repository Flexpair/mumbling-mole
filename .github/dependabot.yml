version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
  - package-ecosystem: devcontainers
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: sunday
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - devcontainer
