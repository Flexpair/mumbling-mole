version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - devcontainer
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
