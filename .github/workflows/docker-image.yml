name: Build and push to DockerHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["lite"]
    tags: ["*"]
  pull_request:
    branches: ["lite"]

env:
  TEST_TAG: jafudi/mumbling-mole:test

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies for audit
        run: npm ci --omit=optional || npm i --omit=optional

      - name: Security audit gate
        run: npm run audit:ci

      - name: Dependency check gate
        run: npm run check:deps

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run Python auth-server tests
        run: python3 auth-server/test_server.py

      - name: Verify coverage thresholds
        run: |
          # Jest enforces thresholds defined in jest.config.js
          # This step logs the current coverage for visibility
          if [ -f coverage/coverage-summary.json ]; then
            echo "📊 Coverage Summary:"
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('  Statements: ' + c.statements.pct + '%');
              console.log('  Branches:   ' + c.branches.pct + '%');
              console.log('  Functions:  ' + c.functions.pct + '%');
              console.log('  Lines:      ' + c.lines.pct + '%');
            "
          fi
          echo "✅ Coverage thresholds passed (enforced by Jest)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (prod stage, amd64 only)
        uses: docker/build-push-action@v7
        continue-on-error: false
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.TEST_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker push "$tag"
            fi
          done
