name: Build and push to DockerHub

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["lite"]
    tags: ["*"]
  pull_request:
    branches: ["lite"]

env:
  TEST_TAG: jafudi/mumbling-mole:test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies for audit and tests
        run: npm ci --ignore-scripts

      - name: Security audit gate
        run: npm run audit:ci

      - name: Dependency check gate
        run: npm run check:deps

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run Python auth-server tests
        run: |
          python3 -m pip install --only-binary :all: pytest==8.3.5 pytest-cov==7.1.0
          python3 -m pytest auth-server/ \
            --cov=server \
            --cov=websockify_auth \
            --cov=websockify_runner \
            --cov-report=xml:coverage/python-coverage.xml

      - name: Verify coverage thresholds
        run: |
          # Jest enforces thresholds defined in jest.config.js
          # This step logs the current coverage for visibility
          if [ -f coverage/coverage-summary.json ]; then
            echo "📊 Coverage Summary:"
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('  Statements: ' + c.statements.pct + '%');
              console.log('  Branches:   ' + c.branches.pct + '%');
              console.log('  Functions:  ' + c.functions.pct + '%');
              console.log('  Lines:      ' + c.lines.pct + '%');
            "
          fi
          echo "✅ Coverage thresholds passed (enforced by Jest)"

      - name: Check SonarCloud credentials
        id: sonar
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "${SONAR_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SonarCloud scan skipped because SONAR_TOKEN is not configured."
          fi

      - name: Analyze with SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (prod stage, amd64 only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        continue-on-error: false
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.TEST_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Verify unauthenticated WebSocket tunnel is rejected
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$TEST_TAG" -c '
            test "$(id -u)" -ne 0 &&
            test -r /home/node/auth-server/websockify_auth.py &&
            ! test -w /home/node/auth-server/websockify_auth.py &&
            test -r /home/node/auth-server/websockify_runner.py &&
            ! test -w /home/node/auth-server/websockify_runner.py
          '
          docker run --detach \
            --name mumbling-mole-smoke \
            --publish 127.0.0.1:18081:8081 \
            --env MUMBLE_SERVER=127.0.0.1:64738 \
            --env MUMBLE_PASSWORD=smoke-mumble-password \
            --env GUAC_ADMIN_PASSWORD=smoke-guac-admin-password \
            --env GUAC_EDITOR_PASSWORD=smoke-guac-editor-password \
            --env GUAC_WATCHER_PASSWORD=smoke-guac-watcher-password \
            --env TRUSTED_PROXIES=127.0.0.1/32,::1/128 \
            "$TEST_TAG"
          cleanup() {
            docker logs mumbling-mole-smoke 2>/dev/null || true
            docker stop mumbling-mole-smoke >/dev/null 2>&1 || true
            docker rm mumbling-mole-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --http1.1 \
              --header 'Connection: Upgrade' \
              --header 'Upgrade: websocket' \
              --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
              --header 'Sec-WebSocket-Version: 13' \
              http://127.0.0.1:18081/murmur || true)"
            if [[ "$status" == "401" ]]; then
              exit 0
            fi
            if [[ "$status" != "000" ]]; then
              docker logs mumbling-mole-smoke
              echo "Expected HTTP 401 from unauthenticated WebSocket request, got $status" >&2
              exit 1
            fi
            sleep 1
          done

          docker logs mumbling-mole-smoke
          echo "WebSocket tunnel did not become ready" >&2
          exit 1

      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker push "$tag"
            fi
          done
