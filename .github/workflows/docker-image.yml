name: Build and push to DockerHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["lite"]
    tags: ["*"]
  pull_request:
    branches: ["lite"]

env:
  TEST_TAG: jafudi/mumbling-mole:test

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies for audit
        run: npm ci --omit=optional || npm i --omit=optional

      - name: Security audit gate
        run: npm run audit:ci

      - name: Dependency check gate
        run: npm run check:deps

      - name: Run unit tests
        run: npm run test:unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (prod stage, amd64 only)
        uses: docker/build-push-action@v6
        continue-on-error: false
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.TEST_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Removed cache-to to avoid 502 errors from GitHub Actions cache backend
          # See: https://github.com/docker/build-push-action/issues/1967
          build-args: |
            GIT_COMMIT=${{ github.sha }}

