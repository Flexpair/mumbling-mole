name: Build and push to DockerHub

# Verhindert parallele Doppel-Läufe pro Branch/Tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["lite"]
    tags: ["*"]
  pull_request:
    branches: ["lite"]

env:
  # Lokales Test-Tag für Lauf auf dem Runner
  TEST_TAG: jafudi/mumbling-mole:test

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # --- Code holen ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Buildx für Cache (kein QEMU, da kein Multi-Arch) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Tags/Labels generieren (Branch/Tag/SHA) ---
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      # --- Login nur bei Nicht-PRs ---
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================================
      # EINMALIGES BUILD (amd64), ins lokale Docker laden
      # -> gleiche Image-Instanz wird getestet und danach gepusht
      # =========================================================
      - name: Build image (prod stage, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          # Wir vergeben sowohl das Test-Tag als auch die finalen Tags.
          # So können wir sie später ohne Rebuild pushen.
          tags: |
            ${{ env.TEST_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- HTTP-Smoke: statische Web-App prüft Basis-Funktion ---
      # Voraussetzung: docker-entrypoint.sh respektiert SKIP_TUNNEL=1
      - name: HTTP smoke test (content-length)
        run: |
          set -euo pipefail
          cleanup() { docker rm -f mm-http >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --rm \
            -p 8081:8081 \
            -e SKIP_TUNNEL=1 \
            --name mm-http \
            ${{ env.TEST_TAG }}

          # Warte bis der Port antwortet und hole HTTP-Header
          for i in {1..30}; do
            if curl -sfI "http://localhost:8081" >/tmp/headers; then break; fi
            sleep 1
          done

          if ! [ -s /tmp/headers ]; then
            echo "Kein HTTP-Header von :8081 erhalten"
            exit 1
          fi

          bytes=$(awk '/^Content-Length:/ {print $2+0}' /tmp/headers | tail -n1)
          echo "Content-Length: ${bytes:-0}"
          if [ "${bytes:-0}" -le 5000 ]; then
            echo "Erwartet Content-Length > 5000 Bytes"
            exit 1
          fi

      # --- Node 16 nur für das E2E-Skript (ws/wait-port) ---
      - name: Setup Node 16 (for E2E script)
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'

      # Nur nötige Dev-Dependencies installieren (greift auf package-lock.json zu;
      # fällt andernfalls auf npm i zurück; engine-warnungen sind ok)
      - name: Install dev deps for E2E
        run: |
          npm ci --omit=optional || npm i --omit=optional

      # --- E2E-Container starten: websockify 8081 -> Host:5900 (Plain TCP) ---
      - name: Run container for E2E
        run: |
          docker run -d --rm \
            --name mm-e2e \
            --add-host host.docker.internal:host-gateway \
            -p 8081:8081 \
            -e MUMBLE_SERVER=host.docker.internal:5900 \
            -e PLAIN_TARGET=1 \
            ${{ env.TEST_TAG }}

      # --- E2E: WS-Tunnel Echo-Roundtrip (nutzt Repo-Skript) ---
      - name: E2E websocket tunnel (echo roundtrip)
        env:
          E2E_WS_PORT: '8081'
          E2E_TCP_PORT: '5900'
          E2E_TARGET_HOST: '127.0.0.1'
        run: node scripts/e2e-check.cjs --mode=container

      # --- Bei Fehler: Logs helfen sofort ---
      - name: Debug logs (mm-e2e)
        if: failure()
        run: |
          echo "----- docker logs mm-e2e -----"
          docker logs mm-e2e || true
          echo "----- best effort curl http://localhost:8081 -----"
          curl -sS http://localhost:8081 || true

      # --- Aufräumen E2E-Container ---
      - name: Cleanup E2E container
        if: always()
        run: docker rm -f mm-e2e || true

      # =========================================================
      # PUSH OHNE REBUILD
      # Wir haben oben bereits alle finalen Tags lokal gesetzt.
      # Jetzt pushen wir genau diese Tags – einer nach dem anderen.
      # =========================================================
      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Schritte aus meta.outputs.tags (Zeilenliste) einzeln pushen
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker push "$tag"
            fi
          done
