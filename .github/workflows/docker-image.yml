name: Build and push to DockerHub

on:
  push:
    branches: ["lite"]
    tags: ["*"]
  pull_request:
    branches: ["lite"]

env:
  TEST_TAG: jafudi/mumbling-mole:test

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Buildx / QEMU ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Image-Metadaten (Tags/Labels) ---
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      # --- Login nur bei Nicht-PRs ---
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Test-Image lokal bauen (prod-Stage), mit Cache ---
      - name: Build test image (prod stage, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- HTTP-Smoke: nur statische Web-App prüfen ---
      # Voraussetzung: docker-entrypoint.sh unterstützt SKIP_TUNNEL=1
      - name: HTTP smoke test (content-length)
        run: |
          set -euo pipefail
          cleanup() { docker rm -f mm-http >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --rm \
            -p 8081:8081 \
            -e SKIP_TUNNEL=1 \
            --name mm-http \
            ${{ env.TEST_TAG }}

          # Auf Port warten und HEAD abrufen
          for i in {1..30}; do
            if curl -sfI "http://localhost:8081" >/tmp/headers; then break; fi
            sleep 1
          done

          if ! [ -s /tmp/headers ]; then
            echo "HTTP headers could not be fetched from :8081"
            exit 1
          fi

          # Zahl extrahieren; awk +0 wandelt in Integer (strippt CR/LF)
          bytes=$(awk '/^Content-Length:/ {print $2+0}' /tmp/headers | tail -n1)
          echo "Content-Length: ${bytes:-0}"

          if [ "${bytes:-0}" -le 5000 ]; then
            echo "Expected Content-Length > 5000 bytes"
            exit 1
          fi

      # --- Node 16 für das E2E-Testskript bereitstellen ---
      - name: Setup Node 16 for E2E script
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'

      # --- Dev-Dependencies für E2E installieren (ws, wait-port) ---
      - name: Install dev deps for E2E
        run: |
          npm ci --omit=optional || npm i --omit=optional

      # --- Container für E2E starten: websockify 8081 -> host.docker.internal:5900 (Plain TCP) ---
      - name: Run container for E2E
        run: |
          docker run -d --rm \
            --name mm-e2e \
            --add-host host.docker.internal:host-gateway \
            -p 8081:8081 \
            -e MUMBLE_SERVER=host.docker.internal:5900 \
            -e PLAIN_TARGET=1 \
            ${{ env.TEST_TAG }}

      # --- E2E: WebSocket-Tunnel Echo-Roundtrip (nutzt Repo-Skript) ---
      - name: E2E websocket tunnel (echo roundtrip)
        env:
          E2E_WS_PORT: '8081'
          E2E_TCP_PORT: '5900'
          E2E_TARGET_HOST: '127.0.0.1'
        run: node scripts/e2e-check.cjs --mode=container

      # --- Aufräumen des E2E-Containers ---
      - name: Cleanup E2E container
        if: always()
        run: docker rm -f mm-e2e || true

      # --- Final: Multi-Arch Build & Push (nur bei Nicht-PRs) ---
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
