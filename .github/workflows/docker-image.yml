# This GitHub Actions workflow builds a Docker image from the repository source code
# and pushes it to DockerHub registry for distribution and deployment.
#
# Triggers:
# - Automatically runs when code is pushed to main/master branch
# - Can be manually triggered via workflow_dispatch
#
# What it does:
# - Checks out the repository source code
# - Sets up Node.js environment and builds the application
# - Runs console allowlist tests to validate browser output
# - Performs HTML smoke test to verify static content serving
# - Executes E2E WebSocket tunnel test with echo roundtrip
# - Sets up Docker Buildx for advanced build features
# - Authenticates with DockerHub using stored secrets
# - Builds the Docker image using the Dockerfile in the repo root
# - Tags the image with appropriate version/latest tags
# - Pushes the built image to DockerHub registry
#
# What it does NOT test:
# - Does not run unit tests or integration tests
# - Does not perform security scanning of the image
# - Does not validate the application functionality
# - Does not test deployment to any environment
#
# Prerequisites:
# - DOCKERHUB_USERNAME secret must be configured in repository settings
# - DOCKERHUB_TOKEN secret must be configured in repository settings
# - Valid Dockerfile must exist in repository root
name: Build and push to DockerHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches: ["**"]

env:
  TEST_TAG: jafudi/mumbling-mole:test
  SMOKE_HTTP_PORT: "8081"
  E2E_WS_PORT: "8082"
  E2E_TCP_PORT: "5900"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run source-based tests (build + console allowlist) before building/pushing the image
      - name: Setup Node 20 (tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dev deps
        run: npm ci --omit=optional || npm i --omit=optional

      - name: Install Playwright Chromium
        run: npm run test:console:install

      - name: Build (for console test)
        run: npm run build

      - name: Console allowlist
        run: npm run test:console

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jafudi/mumbling-mole
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (prod stage, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.TEST_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: HTML smoke test (content-length on :${{ env.SMOKE_HTTP_PORT }})
        env:
          SMOKE_HTTP_PORT: ${{ env.SMOKE_HTTP_PORT }}
        run: |
          set -euo pipefail
          cleanup() { docker rm -f mm-http >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --rm \
            -p ${SMOKE_HTTP_PORT}:8081 \
            -e SKIP_TUNNEL=1 \
            --name mm-http \
            ${{ env.TEST_TAG }}

          for i in {1..30}; do
            if curl -sfI "http://127.0.0.1:${SMOKE_HTTP_PORT}" >/tmp/headers; then break; fi
            sleep 1
          done

          if ! [ -s /tmp/headers ]; then
            echo "Kein HTTP-Header von :${SMOKE_HTTP_PORT} erhalten"
            exit 1
          fi

          bytes=$(awk '/^Content-Length:/ {print $2+0}' /tmp/headers | tail -n1)
          echo "Content-Length: ${bytes:-0}"
          if [ "${bytes:-0}" -le 5000 ]; then
            echo "Erwartet Content-Length > 5000 Bytes"
            exit 1
          fi

  # Node + deps already set up above for E2E script

      - name: Run container for E2E
        env:
          E2E_WS_PORT: ${{ env.E2E_WS_PORT }}
          E2E_TCP_PORT: ${{ env.E2E_TCP_PORT }}
        run: |
          set -euo pipefail
          docker rm -f mm-e2e >/dev/null 2>&1 || true

          docker run -d --rm \
            --name mm-e2e \
            --add-host host.docker.internal:host-gateway \
            -p ${E2E_WS_PORT}:8081 \
            -e MUMBLE_SERVER=host.docker.internal:${E2E_TCP_PORT} \
            -e PLAIN_TARGET=1 \
            ${{ env.TEST_TAG }}

      - name: E2E websocket tunnel (echo roundtrip)
        env:
          E2E_WS_PORT: ${{ env.E2E_WS_PORT }}
          E2E_TCP_PORT: ${{ env.E2E_TCP_PORT }}
          E2E_TARGET_HOST: "127.0.0.1"
        run: node scripts/e2e-check.cjs --mode=container

      - name: Debug logs (mm-e2e)
        if: failure()
        run: |
          echo "----- docker logs mm-e2e -----"
          docker logs mm-e2e || true
          echo "----- netstat (ports) -----"
          ss -ltnp || true

      - name: Cleanup E2E container
        if: always()
        run: docker rm -f mm-e2e || true

      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker push "$tag"
            fi
          done
