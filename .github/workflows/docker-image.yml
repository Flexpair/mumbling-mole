      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker push "$tag"
            fi
          done
