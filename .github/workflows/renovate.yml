name: Renovate

on:
  schedule:
    - cron: '0 * * * *'  # hourly; Renovate will respect schedule in renovate.json5
  workflow_dispatch: {}
  push:
    branches:
      - lite
    paths:
      - 'renovate.json'
      - 'renovate.json5'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.6
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          configurationFile: renovate.json5