name: Console Regression Check

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  console-regression:
    name: Vergleiche Konsolenmeldungen Prod vs Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sammle & vergleiche Console-Ausgaben
        env:
          PROD_URL: https://public-playground.flexpair.app/
          STAGING_URL: https://mutual-krill.flexpair.app/
          STRIP_SUBSTRINGS: ''
          IGNORE_ORDER: 'true'
        run: |
          set -euo pipefail
          echo "Installiere Puppeteer & Diff Bibliothek"
          npm --yes init >/dev/null 2>&1 || true
          npm install --no-audit --no-fund puppeteer@latest diff@5 >/dev/null
          node - <<'EOF'
          const puppeteer = require('puppeteer');
          const {diffLines} = require('diff');
          const PROD = process.env.PROD_URL;
          const STAGE = process.env.STAGING_URL;
          const STRIP = (process.env.STRIP_SUBSTRINGS||'').split(',').map(s=>s.trim()).filter(Boolean);
          const IGNORE_ORDER = /^true$/i.test(process.env.IGNORE_ORDER||'');
          if(!PROD||!STAGE) { console.error('PROD_URL oder STAGING_URL fehlt'); process.exit(1); }

          const normalizeMessage = (m) => m
            .replace(/https?:\/\/[^\s)"']+/g, url => {
              try { const u = new URL(url); return u.pathname + (u.search||''); } catch { return url; }
            })
            .replace(/\s+/g,' ') // Whitespace normalisieren
            .trim();

          async function collect(url) {
            const browser = await puppeteer.launch({headless: 'new', args:['--no-sandbox','--disable-setuid-sandbox']});
            const page = await browser.newPage();
            page.setDefaultNavigationTimeout(60000);
            const msgs = [];
            page.on('console', msg => { try { msgs.push(`[${msg.type()}] ${msg.text()}`); } catch {} });
            page.on('pageerror', err => msgs.push(`[pageerror] ${err.message}`));
            page.on('response', resp => {
              if (resp.status() >= 400) {
                try { const u = new URL(resp.url()); msgs.push(`[http ${resp.status()}] ${u.pathname}${u.search||''}`); } catch { msgs.push(`[http ${resp.status()}] ${resp.url()}`); }
              }
            });
            await page.goto(url, {waitUntil:'networkidle2'});
            await page.waitForTimeout(1500);
            await browser.close();
            return msgs;
          }

          (async () => {
            console.log('Sammle Console-Ausgaben PROD:', PROD);
            const prodRaw = await collect(PROD);
            console.log('Sammle Console-Ausgaben STAGING:', STAGE);
            const stageRaw = await collect(STAGE);

            const transform = list => list.map(m => {
              let t = normalizeMessage(m);
              for (const s of STRIP) if (s) t = t.split(s).join('');
              return t;
            });

            const prod = transform(prodRaw);
            const stage = transform(stageRaw);

            console.log(`PROD: ${prod.length} Meldungen`);
            console.log(`STAGE: ${stage.length} Meldungen`);

            let prodList = prod.slice();
            let stageList = stage.slice();
            if (IGNORE_ORDER) {
              prodList.sort();
              stageList.sort();
            }

            const prodJoined = prodList.join('\n');
            const stageJoined = stageList.join('\n');

            if (prodJoined === stageJoined) {
              console.log('Regression OK: Konsolenmeldungen identisch' + (IGNORE_ORDER ? ' (Reihenfolge ignoriert).' : '.'));
              return;
            }

            console.error('Regression FEHLER: Unterschiede in den Konsolenmeldungen gefunden.');
            const diffs = diffLines(prodJoined, stageJoined);
            let added=0, removed=0;
            for (const part of diffs) {
              if (part.added) added += part.count || 0; else if (part.removed) removed += part.count || 0;
            }
            console.error(`Zusammenfassung Diff: hinzugefügt=${added} entfernt=${removed}`);
            const linesOut = [];
            for (const part of diffs) {
              const prefix = part.added ? '+' : part.removed ? '-' : ' ';
              const block = part.value.split(/\n/).filter(Boolean).slice(0,60);
              for (const l of block) { if (linesOut.length < 200) linesOut.push(prefix + ' ' + l); }
              if (linesOut.length >= 200) break;
            }
            console.error('--- Diff (gekürzt) ---');
            console.error(linesOut.join('\n'));
            if (!IGNORE_ORDER) {
              const setEqual = prod.slice().sort().join('\n') === stage.slice().sort().join('\n');
              if (setEqual) console.error('Hinweis: Nur Reihenfolge unterscheidet sich. IGNORE_ORDER=true setzen falls akzeptabel.');
            }
            process.exit(1);
          })().catch(e => { console.error('Fehler beim Vergleich:', e); process.exit(1); });
          EOF
