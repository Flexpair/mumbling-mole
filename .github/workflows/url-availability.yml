name: Console Regression Check

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  console-regression:
    name: Vergleiche Konsolenmeldungen Prod vs Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sammle & vergleiche Console-Ausgaben
        env:
          PROD_URL: https://public-playground.flexpair.app/
          STAGING_URL: https://mutual-krill.flexpair.app/
          STRIP_SUBSTRINGS: ''
          IGNORE_ORDER: 'true'
          # Nachrichten mit diesen Pfad-Präfixen (Komma-separiert) werden komplett ignoriert (z.B. Backend-/Proxy Noise)
          IGNORE_PATH_PREFIXES: '/guacamole'
          # Fallback-Zusatzwartezeit (ms) nach stabilem Zustand (klein halten)
          WAIT_AFTER_LOAD_MS: '250'
          # Optionaler CSS-Selector (sichtbares Haupt-UI Element)
          WAIT_FOR_SELECTOR: '#container'
          # Maximale Wartezeit bis Preloader vollständig verschwunden ist
          PRELOADER_TIMEOUT_MS: '12000'
          # Pixel-Toleranzen für visuellen Vergleich
          MAX_DIFF_PIXELS: '50'
          MAX_DIFF_PERCENT: '0.1'
        run: |
          set -euo pipefail
          echo "Installiere Puppeteer & Diff Bibliothek"
          npm --yes init >/dev/null 2>&1 || true
          npm install --no-audit --no-fund puppeteer@latest diff@5 pixelmatch@5 pngjs@7 >/dev/null
          node - <<'EOF'
          const puppeteer = require('puppeteer');
          const {diffLines} = require('diff');
          const PROD = process.env.PROD_URL;
          const STAGE = process.env.STAGING_URL;
          const STRIP = (process.env.STRIP_SUBSTRINGS||'').split(',').map(s=>s.trim()).filter(Boolean);
          const IGNORE_ORDER = /^true$/i.test(process.env.IGNORE_ORDER||'');
          if(!PROD||!STAGE) { console.error('PROD_URL oder STAGING_URL fehlt'); process.exit(1); }

          const normalizeMessage = (m) => m
            .replace(/https?:\/\/[^\s)"']+/g, url => {
              try { const u = new URL(url); return u.pathname + (u.search||''); } catch { return url; }
            })
            .replace(/\s+/g,' ') // Whitespace normalisieren
            .trim();

          const pixelmatch = require('pixelmatch');
          const {PNG} = require('pngjs');
          const VIEWPORT_WIDTH = parseInt(process.env.VIEWPORT_WIDTH||'1280',10);
          const VIEWPORT_HEIGHT = parseInt(process.env.VIEWPORT_HEIGHT||'900',10);
          const MAX_DIFF_PIXELS = parseInt(process.env.MAX_DIFF_PIXELS||'50',10);
          const MAX_DIFF_PERCENT = parseFloat(process.env.MAX_DIFF_PERCENT||'0.1');
          const WAIT_AFTER_LOAD_MS = parseInt(process.env.WAIT_AFTER_LOAD_MS||'250',10);
          const WAIT_FOR_SELECTOR = process.env.WAIT_FOR_SELECTOR || '';
          const PRELOADER_TIMEOUT_MS = parseInt(process.env.PRELOADER_TIMEOUT_MS||'12000',10);

          async function waitForPreloaderGone(page) {
            console.log('Warte auf Verschwinden des Preloaders …');
            try {
              await page.waitForFunction(() => {
                const p = document.querySelector('.preloader');
                if (!p) return true; // entfernt
                const rect = p.getBoundingClientRect();
                // vollständig aus dem Viewport (nach oben geschoben) oder unsichtbar
                const style = window.getComputedStyle(p);
                const offscreen = rect.bottom <= 0;
                const hidden = style.visibility === 'hidden' || style.display === 'none' || parseFloat(style.opacity||'1') === 0;
                return offscreen || hidden;
              }, { timeout: PRELOADER_TIMEOUT_MS, polling: 100 });
              console.log('Preloader verschwunden.');
            } catch(e) {
              console.warn('Preloader Timeout – fahre dennoch fort (mögliche visuelle Flakes).');
            }
          }
          async function collect(url) {
            const browser = await puppeteer.launch({headless: 'new', args:['--no-sandbox','--disable-setuid-sandbox']});
            const page = await browser.newPage();
            await page.setViewport({width: VIEWPORT_WIDTH, height: VIEWPORT_HEIGHT, deviceScaleFactor: 1});
            page.setDefaultNavigationTimeout(60000);
            const msgs = [];
            page.on('console', msg => { try { msgs.push(`[${msg.type()}] ${msg.text()}`); } catch {} });
            page.on('pageerror', err => msgs.push(`[pageerror] ${err.message}`));
            page.on('response', resp => {
              if (resp.status() >= 400) {
                try { const u = new URL(resp.url()); msgs.push(`[http ${resp.status()}] ${u.pathname}${u.search||''}`); } catch { msgs.push(`[http ${resp.status()}] ${resp.url()}`); }
              }
            });
            await page.goto(url, {waitUntil:'networkidle2'});
            // Optional auf zentrales UI-Element warten (sichtbar)
            if (WAIT_FOR_SELECTOR) {
              try { await page.waitForSelector(WAIT_FOR_SELECTOR, {timeout: 8000, visible: true}); } catch(e) { console.warn('Selector nicht gefunden oder nicht sichtbar:', WAIT_FOR_SELECTOR); }
            }
            // Spezifisch auf das vollständige Entfernen / Offscreen-Schieben des Preloaders warten
            await waitForPreloaderGone(page);
            // Kleines Fallback-Delay für letzte Reflows (Fonts etc.)
            await new Promise(r => setTimeout(r, WAIT_AFTER_LOAD_MS));
            // Animationen & Transitions deaktivieren für deterministischen Screenshot
            await page.addStyleTag({content: '* { animation: none !important; transition: none !important; }'});
            // Kurze Frame-Warte um Reflow nach Style-Injektion zu erlauben
            await page.evaluate(() => new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r))));
            const screenshot = await page.screenshot({fullPage:false});
            await browser.close();
            return {msgs, screenshot};
          }

          (async () => {
            console.log('Sammle Console-Ausgaben PROD:', PROD);
            const prodRaw = await collect(PROD);
            console.log('Sammle Console-Ausgaben STAGING:', STAGE);
            const stageRaw = await collect(STAGE);

            const transform = list => list.map(m => {
              let t = normalizeMessage(m);
              for (const s of STRIP) if (s) t = t.split(s).join('');
              return t;
            });

            const prod = transform(prodRaw.msgs);
            const stage = transform(stageRaw.msgs);

              // Pfad-basierte Ignorier-Regeln (z.B. /guacamole API-Fehler ausblenden)
              const PATH_PREFIXES = (process.env.IGNORE_PATH_PREFIXES||'').split(',').map(s=>s.trim()).filter(Boolean);
              const isPathIgnored = (m) => PATH_PREFIXES.some(p => {
                if (!p) return false;
                // Fälle: "] /guacamole" oder "] /guacamole" (mit Space) oder eingebetteter absoluter URL
                return m.includes(`] ${p}`) || m.includes(`]${p}`) || m.includes(` ${p}`);
              });
              const prodBefore = prod.length, stageBefore = stage.length;
              const prodFiltered = prod.filter(m => !isPathIgnored(m));
              const stageFiltered = stage.filter(m => !isPathIgnored(m));
              const prodIgnored = prodBefore - prodFiltered.length;
              const stageIgnored = stageBefore - stageFiltered.length;
              if (PATH_PREFIXES.length) {
                console.log(`Ignoriere Pfad-Präfixe: ${PATH_PREFIXES.join(', ')} | PROD ignoriert: ${prodIgnored} | STAGE ignoriert: ${stageIgnored}`);
              }

            console.log(`PROD: ${prodFiltered.length} Meldungen (nach Ignore)`);
            console.log(`STAGE: ${stageFiltered.length} Meldungen (nach Ignore)`);

            // Relevante Meldungen (Warnungen/Errors inkl. pageerror & HTTP >=400) sammeln
            const relevantFilter = m => /^(\[(error|warning|pageerror|http ))/i.test(m);
            const prodRelevant = prodFiltered.filter(relevantFilter);
            const stageRelevant = stageFiltered.filter(relevantFilter);
            const prodSet = new Set(prodRelevant);
            const extraStage = stageRelevant.filter(m => !prodSet.has(m));
            console.log(`PROD relevante Warn/Error: ${prodRelevant.length}`);
            console.log(`STAGE relevante Warn/Error: ${stageRelevant.length}`);
            let consoleFailed = false;
            if (extraStage.length === 0) {
              console.log('Console Regression OK: STAGING ist Untermenge (keine zusätzlichen Warn/Error Meldungen).');
            } else {
              console.error('Console Regression FEHLER: Zusätzliche Warn/Error Meldungen in STAGING gefunden.');
              const preview = extraStage.slice(0, 40);
              console.error('Neue Meldungen (gekürzt):');
              console.error(preview.join('\n'));
              if (extraStage.length > preview.length) console.error(`... (+${extraStage.length - preview.length} weitere)`);
              consoleFailed = true;
            }

            // Visueller Vergleich
            console.log('Starte visuellen Vergleich…');
            const prodImg = PNG.sync.read(prodRaw.screenshot);
            const stageImg = PNG.sync.read(stageRaw.screenshot);
            if (prodImg.width !== stageImg.width || prodImg.height !== stageImg.height) {
              console.error(`Unterschiedliche Dimensionen: PROD ${prodImg.width}x${prodImg.height} vs STAGE ${stageImg.width}x${stageImg.height}`);
            }
            const w = Math.min(prodImg.width, stageImg.width);
            const h = Math.min(prodImg.height, stageImg.height);
            const diffPng = new PNG({width:w, height:h});
            const diffPixels = pixelmatch(prodImg.data, stageImg.data, diffPng.data, w, h, {threshold:0.1, includeAA:true});
            const total = w * h;
            const diffPercent = (diffPixels/total)*100;
            const fs = require('fs');
            fs.writeFileSync('prod.png', PNG.sync.write(prodImg));
            fs.writeFileSync('stage.png', PNG.sync.write(stageImg));
            fs.writeFileSync('diff.png', PNG.sync.write(diffPng));
            fs.writeFileSync('visual-result.txt', `diffPixels=${diffPixels}\narea=${total}\ndiffPercent=${diffPercent.toFixed(4)}\n`);
            let visualFailed = false;
            if (diffPixels > MAX_DIFF_PIXELS && diffPercent > MAX_DIFF_PERCENT) {
              console.error(`Visuelle Regression FEHLER: ${diffPixels} Pixel (${diffPercent.toFixed(4)}%) > Limit (${MAX_DIFF_PIXELS} / ${MAX_DIFF_PERCENT}%).`);
              visualFailed = true;
            } else {
              console.log(`Visueller Vergleich OK: ${diffPixels} Pixel Unterschied (${diffPercent.toFixed(4)}%).`);
            }

            if (consoleFailed || visualFailed) {
              console.error(`Gesamtstatus: FEHLER (Console=${consoleFailed}, Visual=${visualFailed})`);
              process.exit(1);
            }
            console.log('Gesamtstatus: OK (Console & Visual)');
            return;
          })().catch(e => { console.error('Fehler beim Vergleich:', e); process.exit(1); });
          EOF

      - name: Lade Screenshots & Diff als Artefakt hoch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: |
            prod.png
            stage.png
            diff.png
            visual-result.txt
          if-no-files-found: warn
          retention-days: 7
