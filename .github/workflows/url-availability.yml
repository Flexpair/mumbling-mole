name: URL Availability Check

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  check-url:
    name: Prüfe öffentlich erreichbare URL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTP 200 Erwartung prüfen
        run: |
          set -euo pipefail
          URL="https://public-playground.flexpair.app/"
          echo "Prüfe Erreichbarkeit von $URL"
          # Mehrfach versuchen (Netzwerk-Flakes abfedern)
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 --retry 4 --retry-delay 3 --retry-all-errors "$URL" || true)
          if [ "$status" != "200" ]; then
            echo "FEHLER: Erwartet wurde HTTP 200, erhalten: $status" >&2
            exit 1
          fi
          echo "Erfolg: $URL liefert HTTP 200"
      - name: Prüfe JavaScript Fehler im Browser (Puppeteer)
        env:
          TARGET_URL: https://public-playground.flexpair.app/
          IGNORE_ERROR_PATTERNS: |
            Failed to load resource: the server responded with a status of 403
            translation selector 
            The key "target-densitydpi" is not supported.
            Input elements should have autocomplete attributes
            [http 403] /guacamole/api/tokens
        run: |
          set -euo pipefail
          echo "Installiere Puppeteer (neueste Version)"
          npm --yes init >/dev/null 2>&1 || true
          npm install --no-audit --no-fund puppeteer@latest >/dev/null
          echo "Starte Headless Chrome und lade $TARGET_URL"
          node - <<'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const url = process.env.TARGET_URL;
            const ignore = (process.env.IGNORE_ERROR_PATTERNS || '')
              .split(/\n|;;/)
              .map(s => s.trim())
              .filter(Boolean);
            const browser = await puppeteer.launch({headless: 'new', args: ['--no-sandbox','--disable-setuid-sandbox']});
            const page = await browser.newPage();
            page.setDefaultNavigationTimeout(45000);
            const errors = [];
            const normalize = s => s.replace(/https?:\/\/[^\s)"']+/g, raw => {
              try { const u = new URL(raw); return u.pathname + (u.search||''); } catch { return raw; }
            });
            const isIgnored = txt => {
              const norm = normalize(txt);
              return ignore.some(p => txt.includes(p) || norm.includes(p));
            };
            // ALLE Console-Messages (log, info, warn, error, debug, trace) als Fehler behandeln
            page.on('console', msg => {
              const text = `[console.${msg.type()}] ${msg.text()}`;
              if (!isIgnored(text)) errors.push(text);
            });
            page.on('pageerror', err => {
              const text = '[pageerror] ' + err.message;
              if (!isIgnored(text)) errors.push(text);
            });
            // Sammle auch HTTP Fehlerantworten (>=400) als Warnung
            const httpIssues = [];
            page.on('response', resp => {
              const sc = resp.status();
              if (sc >= 400) {
                let pathOnly;
                try { const u = new URL(resp.url()); pathOnly = u.pathname + (u.search||''); } catch { pathOnly = resp.url(); }
                const info = `[http ${sc}] ${pathOnly}`;
                if (!isIgnored(info)) httpIssues.push(info);
              }
            });
            try {
              await page.goto(url, {waitUntil: 'networkidle2'});
              // einfache Wartezeit via setTimeout (statt deprecated waitForTimeout)
              await new Promise(r => setTimeout(r, 2000));
            } catch (e) {
              errors.push('[navigation] ' + e.message);
            } finally {
              await browser.close();
            }
            // HTTP-Issues zusätzlich als Fehler anhängen, da jede Ausgabe strikt scheitern soll
            if (httpIssues.length) {
              errors.push(...httpIssues.map(i => '[resource] ' + i));
            }
            if (errors.length) {
              console.error('JavaScript/Console Ausgaben gefunden (Anzahl ' + errors.length + '):');
              console.error(errors.join('\n'));
              process.exit(1);
            }
            console.log('Keine Console-Ausgaben oder Fehler produziert.');
          })().catch(e => { console.error('Prüfung abgebrochen:', e); process.exit(1); });
          EOF
