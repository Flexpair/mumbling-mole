---
# Codacy configuration
# See: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  # Auto-generated lock files should not be analyzed for complexity
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"

engines:
  lizard:
    exclude_paths:
      # Mumble protocol client is complex by nature - vendored/forked code
      # This file implements the full Mumble client protocol and cannot be
      # easily split without breaking the API contract
      - "app/mumble-client/client.js"
