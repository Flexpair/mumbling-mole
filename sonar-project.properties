# SonarQube Configuration for mumbling-mole

# Project identification
sonar.projectKey=Flexpair_mumbling-mole
sonar.projectName=Mumbling Mole
sonar.projectVersion=1.0
sonar.organization=flexpair

# Source code directories
sonar.sources=app,auth-server
sonar.sourceEncoding=UTF-8

# Exclude test code from analysis
sonar.exclusions=\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/tests/**,\
  **/*.test.js,\
  **/*.spec.js,\
  auth-server/test_server.py,\
  jest.config.js,\
  jest.setup.js,\
  jest.text-transformer.cjs,\
  playwright.config.js,\
  test-results/**,\
  playwright-report/**

# Do NOT define test files location to prevent analysis
# sonar.tests=__tests__,tests
# sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports (if generated)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage/python-coverage.xml

# Ignore duplicate code in test files
sonar.cpd.exclusions=**/__tests__/**,**/tests/**,**/*.test.js,**/*.spec.js,auth-server/test_server.py
