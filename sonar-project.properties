# SonarQube Configuration for mumbling-mole

# Project identification
sonar.projectKey=mumbling-mole
sonar.projectName=Mumbling Mole
sonar.projectVersion=1.0

# Source code directories
sonar.sources=app
sonar.sourceEncoding=UTF-8

# Exclude ONLY test code from analysis
sonar.exclusions=\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/tests/**,\
  **/*.test.js,\
  **/*.spec.js,\
  jest.config.js,\
  jest.setup.js,\
  jest.text-transformer.cjs,\
  playwright.config.js

# Test files location (for coverage reporting)
sonar.tests=__tests__,tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports (if generated)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js

# Ignore duplicate code in test files
sonar.cpd.exclusions=**/__tests__/**,**/tests/**,**/*.test.js,**/*.spec.js
